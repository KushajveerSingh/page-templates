<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Todo Checklist</title>

    <link rel="stylesheet" href="styles/global-letter-page.css" />
    <link rel="stylesheet" href="styles/repeat-rows.css" />

    <style>
      .checkbox {
        width: 13px;
        height: 13px;
        border: 1.2pt solid #555;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .line {
        flex-grow: 1;
        border-bottom: 1pt solid #888;
        height: 100%;
      }
    </style>

    <script src="scripts/repeat-rows.js" defer></script>
  </head>

  <body>
    <main id="container"></main>

    <template id="template_header">
      <div class="header">
        <span class="title">TITLE:</span>
        <span class="date">DATE:</span>
      </div>
    </template>

    <template id="template_row">
      <div class="row">
        <div class="checkbox"></div>
        <div class="line"></div>
      </div>
    </template>
  </body>
</html>
